{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Login</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="muted">New employee? <a href="{{ url_for('register') }}">Create an account</a>.</p>
  <p class="hint">Demo logins — admin: <code>admin@company.com / admin123</code>,
    employee: <code>employee@company.com / employee123</code></p>
</div>
{% endblock %}
