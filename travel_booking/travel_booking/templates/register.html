{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Employee Registration</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Full name
      <input type="text" name="name" value="{{ form.get('name', '') }}" required>
    </label>
    <label>Work email
      <input type="email" name="email" value="{{ form.get('email', '') }}" required>
    </label>
    <label>Department
      <input type="text" name="department" value="{{ form.get('department', '') }}" placeholder="e.g. Engineering">
    </label>
    <label>Password (min 6 characters)
      <input type="password" name="password" minlength="6" required>
    </label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a>.</p>
</div>
{% endblock %}
